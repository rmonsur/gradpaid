<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GradPaid system architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #0F1115;
      --color-paper-2: #18181B;
      --color-ink:     #FFFFFF;
      --color-muted:   #A1A1AA;
      --color-accent:  #84CC16;
      --color-link:    #7DB3F5;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-mono:     'JetBrains Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1320px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-sans);
      font-size: 1.75rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 72ch;
    }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · GradPaid</p>
    <h1>GradPaid system architecture</h1>
    <p class="sub">One Next.js deployable on Render. Every money movement is a PayPal Agent Toolkit call made by an agent, and every result lands in an append-only Postgres ledger.</p>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-dark-title architecture-dark-desc">
        <title id="architecture-dark-title">GradPaid system architecture</title>
        <desc id="architecture-dark-desc">Architecture diagram showing the browser pages calling Next.js API routes on Render, three agents reaching the PayPal sandbox through the PayPal Agent Toolkit, an append-only Postgres ledger with optional Elastic search, and a Render cron job that triggers disbursement every six hours.</desc>

        </defs>

        <rect width="100%" height="100%" fill="#0F1115"/>

        <!-- Zones (bg -> zones -> arrows -> labels -> nodes) -->

        <rect x="264" y="76" width="124" height="12" rx="2" fill="#0F1115"/>
        <text x="326" y="85" fill="#A1A1AA" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.14em">APP · RENDER WEB SERVICE</text>

        <rect x="248" y="416" width="472" height="152" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.10)" stroke-width="0.8"/>

        <text x="322" y="429" fill="#A1A1AA" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DATA · RENDER POSTGRES</text>

        <rect x="768" y="72" width="472" height="496" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.10)" stroke-width="0.8"/>

        <text x="810" y="85" fill="#A1A1AA" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.14em">EXTERNAL</text>

        <text x="380" y="307" fill="#A1A1AA" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">Vercel AI SDK 4 · Claude</text>
